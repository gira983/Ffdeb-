name: Build Tweak

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        shell: bash
        run: |
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          echo "$THEOS/bin" >> "$GITHUB_PATH"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Install ldid
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
        run: |
          brew install ldid

      - name: Install iOS SDK
        shell: bash
        run: |
          mkdir -p "$THEOS/sdks"
          curl -L --fail https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz -o iPhoneOS16.5.sdk.tar.xz
          tar xf iPhoneOS16.5.sdk.tar.xz -C "$THEOS/sdks/"

      - name: Build with Theos
        shell: bash
        run: |
          make clean
          make package

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: tweak-deb
          path: |
            *.deb
            packages/*.deb
            .theos/**/*.deb
